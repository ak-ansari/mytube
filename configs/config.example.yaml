ENV: dev
DB:
  PG_USER: mytube
  PG_PASS:  mytube
  PG_DB_NAME: mytube
  PG_PORT:  "5432"
  PG_HOST: localhost

REDIS:
  REDIS_PORT: "6379"
  REDIS_HOST: "127.0.0.1"
  REDIS_QUEUE_NAME: video_queue

S3:
  MINIO_ACCESS_KEY: mytube
  MINIO_SECRET_KEY: mytube123
  MINIO_ENDPOINT: localhost:9002
  MINIO_BUCKET: mytube
  MINIO_REDIS_QUEUE_NAME: minio-events-queue

SERVER:
  HTTP_PORT: "8080"

ES:
  PORT: "9200"
  HOST: "localhost"

KEYCLOAK:
  URL: http://localhost:8180
  REALM: mytube
  CLIENT_ID: mytube-frontend

STREAM:
  BASE_URL: http://localhost
  TOKEN_SECRET: change-me-local-dev-secret
