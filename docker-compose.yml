services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    expose:
      - "6379"
    networks:
      - internal

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_SERVER_URL: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The address uses the Docker service name 'redis' and default port '6379'
      MINIO_NOTIFY_REDIS_REDIS_ADDRESS_primary: "redis:6379" 
      MINIO_NOTIFY_REDIS_ENABLE_primary: "on" 
      MINIO_NOTIFY_REDIS_KEY_primary: ${MINIO_REDIS_QUEUE_NAME} # The Redis key/channel
      MINIO_NOTIFY_REDIS_FORMAT_primary: "namespace" # Use 'namespace' for a hash map or 'access' for a list/pubsub
    ports:
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - internal

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "9002:9002"
    depends_on:
      - minio
    networks:
      - internal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false   # disable security for local/dev
    ports:
      - "9200:${ES_PORT}"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - internal

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.1
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - internal

volumes:
  pgdata:
  miniodata:
  esdata:

networks:
  internal:
    driver: bridge
