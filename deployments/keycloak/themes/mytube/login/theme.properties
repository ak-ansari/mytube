# myTube login theme: Keycloak's keycloak.v2 (PatternFly 5) templates with myTube branding on top.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/mytube.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# always dark, like the app (pf-v5-theme-dark switches PatternFly to its dark tokens)
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark mytube
