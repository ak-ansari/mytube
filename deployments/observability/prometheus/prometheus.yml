global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Go apps run on the host (make run-api / run-worker)
  - job_name: mytube-api
    static_configs:
      - targets: ["host.docker.internal:8080"]   # SERVER.HTTP_PORT, path /metrics
  - job_name: mytube-worker
    static_configs:
      - targets: ["host.docker.internal:9091"]   # OBSERVABILITY.METRICS_ADDR

  # infra on the compose network
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster   # needs MINIO_PROMETHEUS_AUTH_TYPE=public on the minio service
    static_configs:
      - targets: ["minio:9000"]

  # the stack itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
