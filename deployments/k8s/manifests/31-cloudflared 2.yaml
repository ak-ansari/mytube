# Free Cloudflare "quick tunnel": public https://<random>.trycloudflare.com -> edge. No account needed.
# The hostname changes whenever this pod restarts; re-run up.sh to pick up the new one.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudflared, namespace: mytube }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.9.1
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://edge:80"]
          resources: { requests: { memory: 32Mi, cpu: 20m }, limits: { memory: 256Mi } }
