apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: es-data, namespace: mytube }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: elasticsearch, namespace: mytube }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports: [{ containerPort: 9200 }]
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: 9200 }
            periodSeconds: 10
          resources: { requests: { memory: 1Gi, cpu: 200m }, limits: { memory: 1536Mi } }
          volumeMounts: [{ name: data, mountPath: /usr/share/elasticsearch/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: es-data }
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch, namespace: mytube }
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200 }]
