apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: mytube }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: mytube-frontend:local
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          resources: { requests: { memory: 16Mi, cpu: 20m }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: mytube }
spec:
  selector: { app: frontend }
  ports: [{ port: 80 }]
