apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: mytube }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: mytube-backend:local
          imagePullPolicy: Never
          command: ["/app/worker", "-config", "/app/configs/config.yaml"]
          # ffmpeg transcodes in /tmp
          resources: { requests: { memory: 128Mi, cpu: 200m }, limits: { memory: 2Gi } }
          volumeMounts:
            - { name: config, mountPath: /app/configs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          secret: { secretName: mytube-config }
        - name: tmp
          emptyDir: {}
