# queue/cache only, no persistence (same as the compose stack)
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: mytube }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          resources: { requests: { memory: 32Mi, cpu: 50m }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: mytube }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
